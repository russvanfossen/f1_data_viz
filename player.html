<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#15151e; --text:#f2f2f2; --muted:#b8b8c4; --line:#8a8a99; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--text); display:flex; flex-direction:column; overflow:hidden;
         font-family:-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; border-radius:8px; }
  .controls { display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; padding:10px 12px 6px; }
  button { background:#262633; color:var(--text); border:1px solid var(--line);
           border-radius:6px; padding:6px 13px; font-size:15px; cursor:pointer; font-family:inherit; }
  button:hover { border-color:var(--text); }
  button:focus-visible, input:focus-visible { outline:2px solid var(--text); outline-offset:2px; }
  button[aria-pressed="true"] { background:var(--text); color:#111; border-color:var(--text); font-weight:600; }
  #play { min-width:92px; font-weight:600; }
  .group { display:flex; gap:4px; align-items:center; }
  .label { color:var(--muted); font-size:14px; margin-right:4px; }
  #scrub { flex:1; min-width:160px; accent-color:var(--text); }
  #clock { font-family:ui-monospace, Menlo, Consolas, monospace; font-size:15px; min-width:118px; text-align:right; }
  .info { display:flex; flex-wrap:wrap; align-items:center; gap:6px 22px; padding:4px 12px 6px; }
  .legend { display:flex; align-items:center; gap:8px; font-size:14px; color:var(--muted); }
  #bar { width:160px; height:10px; border-radius:3px; border:1px solid var(--line); }
  .chips { display:flex; flex-wrap:wrap; gap:6px 18px; }
  .chip { font-size:15px; white-space:nowrap; }
  .chip b { font-family:ui-monospace, Menlo, Consolas, monospace; font-size:16px; }
  .chip .pos { display:inline-block; min-width:28px; color:var(--muted); font-weight:600; }
  .stage { flex:1; min-height:0; position:relative; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
</style>
</head>
<body>
<div class="controls">
  <button id="play" aria-label="Play">▶ Play</button>
  <button id="restart">↺ Restart</button>
  <input id="scrub" type="range" min="0" step="0.01" value="0" aria-label="Lap time">
  <span id="clock"></span>
  <div class="group" id="speeds"><span class="label">Speed</span></div>
</div>
<div class="info">
  <div class="legend"><span>Slow</span><div id="bar"></div><span>Fast</span><span id="range"></span></div>
  <div class="chips" id="chips"></div>
</div>
<div class="stage"><canvas id="map"></canvas></div>

<script>
const D = __DATA__;

// Fit the player to the visible window: grow/shrink this iframe so the map ends at the bottom of the screen.
(function fitToWindow() {
  try {
    const frame = window.frameElement, host = window.parent;
    if (!frame || !host) return;
    const fit = () => {
      const top = frame.getBoundingClientRect().top + host.scrollY;
      const h = Math.max(D.minH, Math.min(D.maxH, host.innerHeight - Math.max(top - host.scrollY, 0) - 16));
      frame.style.height = h + "px";
      frame.height = h;
    };
    fit();
    host.addEventListener("resize", fit);
  } catch (e) { /* cross-origin or no parent: keep the fixed height Streamlit gave us */ }
})();

// YlOrRd: pale yellow = slowest, deep red = fastest (darkest stop trimmed so it shows on dark)
const STOPS = ["#ffffcc","#ffe895","#fec45f","#fd953f","#fa4a29","#d6111f","#b10026"];
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
const rgbStops = STOPS.map(hexToRgb);
document.getElementById("bar").style.background = `linear-gradient(to right, ${STOPS.join(",")})`;
document.getElementById("range").textContent = `${Math.round(D.smin)}–${Math.round(D.smax)} km/h`;
function colorFor(s) {
  let f = (s - D.smin) / Math.max(D.smax - D.smin, 1e-9);
  f = Math.min(1, Math.max(0, f)) * (rgbStops.length - 1);
  const i = Math.min(Math.floor(f), rgbStops.length - 2), u = f - i;
  const a = rgbStops[i], b = rgbStops[i + 1];
  return `rgb(${a.map((v, k) => Math.round(v + (b[k] - v) * u)).join(",")})`;
}

const SHAPES = ["circle", "square", "diamond", "triangle"];
const SYMBOL = { circle:"●", square:"■", diamond:"◆", triangle:"▲" };
const TRACK = "#454556";
const TAIL_S = 2.5;  // seconds of speed-colored tail behind each car

let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity, T_END = 0;
D.drivers.forEach((d, n) => {
  d.shape = SHAPES[n % SHAPES.length];
  d.x.forEach(v => { minX = Math.min(minX, v); maxX = Math.max(maxX, v); });
  d.y.forEach(v => { minY = Math.min(minY, v); maxY = Math.max(maxY, v); });
  T_END = Math.max(T_END, d.t[d.t.length - 1]);
  // distance along the lap, used to rank who's ahead
  d.dist = [0];
  for (let i = 1; i < d.x.length; i++) d.dist.push(d.dist[i-1] + Math.hypot(d.x[i] - d.x[i-1], d.y[i] - d.y[i-1]));
});

function idxAt(d, T) {  // last sample index with t <= T
  let lo = 0, hi = d.t.length - 1;
  if (T >= d.t[hi]) return hi;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (d.t[m] <= T) lo = m; else hi = m - 1; }
  return lo;
}
function stateAt(d, T) {
  const i = idxAt(d, T), last = d.t.length - 1;
  if (i >= last) return { i, x: d.x[last], y: d.y[last], s: d.s[last], done: true };
  const u = (T - d.t[i]) / (d.t[i + 1] - d.t[i] || 1);
  return { i, u, x: d.x[i] + (d.x[i+1] - d.x[i]) * u, y: d.y[i] + (d.y[i+1] - d.y[i]) * u,
           s: d.s[i] + (d.s[i+1] - d.s[i]) * u, done: false };
}

function drawShape(ctx, shape, x, y, r) {
  ctx.beginPath();
  if (shape === "circle") ctx.arc(x, y, r, 0, Math.PI * 2);
  else if (shape === "square") ctx.rect(x - r * 0.9, y - r * 0.9, r * 1.8, r * 1.8);
  else if (shape === "diamond") { ctx.moveTo(x, y - r * 1.25); ctx.lineTo(x + r * 1.25, y); ctx.lineTo(x, y + r * 1.25); ctx.lineTo(x - r * 1.25, y); ctx.closePath(); }
  else { ctx.moveTo(x, y - r * 1.3); ctx.lineTo(x + r * 1.2, y + r * 0.9); ctx.lineTo(x - r * 1.2, y + r * 0.9); ctx.closePath(); }
}

// ---- map
const canvas = document.getElementById("map"), ctx = canvas.getContext("2d");
const trackLayer = document.createElement("canvas");
let dpr = 1, X = v => v, Y = v => v;

function layout() {
  dpr = window.devicePixelRatio || 1;
  const W = Math.max(1, canvas.clientWidth * dpr), H = Math.max(1, canvas.clientHeight * dpr), pad = 30 * dpr;
  canvas.width = trackLayer.width = W; canvas.height = trackLayer.height = H;
  // one scale for both axes, so the track keeps its real shape, sized to whichever side is tighter
  const sc = Math.min((W - 2 * pad) / (maxX - minX || 1), (H - 2 * pad) / (maxY - minY || 1));
  const ox = (W - (maxX - minX) * sc) / 2, oy = (H - (maxY - minY) * sc) / 2;
  X = x => ox + (x - minX) * sc;
  Y = y => H - (oy + (y - minY) * sc);  // flip so north is up
  const c = trackLayer.getContext("2d"), d = D.drivers[0];
  c.clearRect(0, 0, W, H);
  c.lineCap = c.lineJoin = "round"; c.strokeStyle = TRACK; c.lineWidth = 12 * dpr;
  c.beginPath(); d.x.forEach((x, i) => i ? c.lineTo(X(x), Y(d.y[i])) : c.moveTo(X(x), Y(d.y[i]))); c.stroke();
}

const chipsEl = document.getElementById("chips");
const chips = D.drivers.map(() => { const el = document.createElement("span"); el.className = "chip"; chipsEl.appendChild(el); return el; });

function render() {
  const states = D.drivers.map(d => stateAt(d, T)), r = dpr;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(trackLayer, 0, 0);
  ctx.lineCap = "round"; ctx.lineWidth = 6 * r;
  D.drivers.forEach((d, n) => {  // tails
    const st = states[n], i0 = idxAt(d, Math.max(0, T - TAIL_S));
    for (let i = i0; i < st.i; i++) {
      ctx.strokeStyle = colorFor((d.s[i] + d.s[i+1]) / 2);
      ctx.beginPath(); ctx.moveTo(X(d.x[i]), Y(d.y[i])); ctx.lineTo(X(d.x[i+1]), Y(d.y[i+1])); ctx.stroke();
    }
    if (!st.done) {
      ctx.strokeStyle = colorFor(st.s);
      ctx.beginPath(); ctx.moveTo(X(d.x[st.i]), Y(d.y[st.i])); ctx.lineTo(X(st.x), Y(st.y)); ctx.stroke();
    }
  });
  D.drivers.forEach((d, n) => {  // cars on top of every tail
    const st = states[n], cx = X(st.x), cy = Y(st.y);
    ctx.lineWidth = 3 * r; ctx.strokeStyle = "#000"; ctx.fillStyle = "#fff";
    drawShape(ctx, d.shape, cx, cy, 9 * r); ctx.fill(); ctx.stroke();
    ctx.font = `700 ${14 * r}px sans-serif`; ctx.textBaseline = "middle";
    const w = ctx.measureText(d.abbr).width;
    ctx.fillStyle = "rgba(0,0,0,0.75)"; ctx.fillRect(cx + 13 * r, cy - 10 * r, w + 8 * r, 20 * r);
    ctx.fillStyle = "#fff"; ctx.fillText(d.abbr, cx + 17 * r, cy);
  });
  // running order by distance covered
  const dist = states.map((st, n) => {
    const d = D.drivers[n];
    return st.done ? d.dist[d.dist.length - 1] : d.dist[st.i] + (d.dist[st.i+1] - d.dist[st.i]) * st.u;
  });
  dist.map((v, n) => n).sort((a, b) => dist[b] - dist[a]).forEach((n, k) => {
    const d = D.drivers[n], st = states[n];
    const pos = D.drivers.length > 1 ? `<span class="pos">P${k + 1}</span>` : "";
    chips[n].innerHTML = `${pos}${SYMBOL[d.shape]} ${d.abbr} · Lap ${d.lap} · ` +
      `<b>${st.done ? "Finished " + d.lapTime : Math.round(st.s) + " km/h"}</b>`;
    chipsEl.appendChild(chips[n]);  // reorder to match running order
  });
  scrub.value = T;
  clock.textContent = `${T.toFixed(1)} / ${T_END.toFixed(1)} s`;
}

// ---- controls
let T = 0, playing = false, rate = 1, lastTs = null;
const playBtn = document.getElementById("play"), scrub = document.getElementById("scrub"),
      clock = document.getElementById("clock");
scrub.max = T_END;

function setPlaying(on) {
  playing = on;
  if (on && T >= T_END) T = 0;
  playBtn.textContent = on ? "❚❚ Pause" : "▶ Play";
  playBtn.setAttribute("aria-label", on ? "Pause" : "Play");
  lastTs = null;
}
playBtn.onclick = () => setPlaying(!playing);
document.getElementById("restart").onclick = () => { T = 0; render(); };
scrub.oninput = () => {
  T = parseFloat(scrub.value);
  if (T >= T_END - 0.011) T = T_END;  // slider step rounding can land just short of the end
  render();
};

const speedBox = document.getElementById("speeds");
[1, 2, 4, 8].forEach(v => {
  const b = document.createElement("button");
  b.textContent = v + "×"; b.setAttribute("aria-pressed", v === rate);
  b.onclick = () => { rate = v; speedBox.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); };
  speedBox.appendChild(b);
});

function loop(ts) {
  if (playing) {
    if (lastTs !== null) T += (ts - lastTs) / 1000 * rate;
    lastTs = ts;
    if (T >= T_END) { T = T_END; setPlaying(false); }
    render();
  }
  requestAnimationFrame(loop);
}

// re-layout whenever the map area changes size (window resize, iframe resized to fit)
new ResizeObserver(() => { layout(); render(); }).observe(canvas);
layout();
render();
requestAnimationFrame(loop);
</script>
</body>
</html>
